{% load static %}
<nav class="navbar navbar-expand navbar-light bg-white topbar mb-0 static-top shadow-sm">
    <!-- ===== TOGGLE MOBILE ===== -->
    <button id="sidebarToggleTop"
        class="btn btn-link d-lg-none rounded-circle mr-3"
        style="color: #64748b; font-size: 1.2rem; padding: 4px 8px;">
    <i class="fas fa-bars"></i>
    </button>

    <!-- ===== LOGO MOBILE ===== -->
    <a class="navbar-brand d-md-none" href="#" style="font-weight: 700; color: #1e293b; font-size: 1rem;">
        <i class="fas fa-hand-holding-usd" style="color: #4f46e5;"></i> Likelemba
    </a>

    <!-- ===== SEARCH BAR ===== -->
    <form class="d-none d-sm-inline-block form-inline mr-auto my-2 my-md-0">
        <div class="search-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input type="text" class="form-control" placeholder="Rechercher...">
        </div>
    </form>

    <!-- ===== NAVBAR RIGHT ===== -->
    <ul class="navbar-nav ml-auto align-items-center" style="flex-direction: row; gap: 2px;">

    <!-- Notifications -->
    <li class="nav-item">
        <a class="nav-link"
        href="{% url 'liste_demandes_adhesion' %}"
        role="button"
        style="position: relative;">

            <i class="fas fa-bell fa-fw" style="font-size: 1.1rem;"></i>

            {% if notifications_non_lues > 0 %}
                <span class="notification-badge">
                    {{ notifications_non_lues }}
                </span>
            {% endif %}

        </a>
    </li>

    <!-- ===== MODE SOMBRE ===== -->
    <li class="nav-item">
        <a class="nav-link"
        href="#"
        id="darkModeToggle"
        role="button"
        title="Activer le mode sombre">

            <i class="fas fa-moon fa-fw"
            id="darkModeIcon"
            style="font-size: 1.1rem;"></i>

        </a>
    </li>

        <div class="topbar-divider d-none d-sm-block"></div>

        <!-- ===== USER PROFILE ===== -->
        <li class="nav-item">
            <a class="nav-link dropdown-toggle user-profile" href="#" id="userDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                {% if request.user.photo %}
                    <img src="{{ request.user.photo.url }}" alt="Photo de profil">
                {% else %}
                    <img src="{% static 'img/undraw_profile_2.svg' %}" alt="Photo de profil">
                {% endif %}
                <div class="user-info d-none d-lg-block">
                    <span class="user-name">{{ request.user.username }}</span>
                    <span class="user-role">
                        <i class="fas fa-circle" style="color: #22c55e;"></i>
                        {{ request.user.get_role_display }}
                    </span>
                </div>
                <i class="fas fa-chevron-down chevron"></i>
            </a>

            <!-- ===== DROPDOWN MENU ===== -->
            <div class="dropdown-menu dropdown-menu-right shadow-lg border-0" 
                aria-labelledby="userDropdown" 
                style="border-radius: 12px; padding: 6px; min-width: 200px; margin-top: 8px;">
                
                <a class="dropdown-item" href="{% url 'liste_demandes_adhesion' %}" style="border-radius: 8px; padding: 8px 14px; font-size: 0.85rem;">
                    <i class="fas fa-bell fa-sm fa-fw me-2 text-warning"></i>
                    Notifications
                </a>
                <a class="dropdown-item" href="{% url 'aide_admin' %}" style="border-radius: 8px; padding: 8px 14px; font-size: 0.85rem;">
                    <i class="fas fa-life-ring fa-sm fa-fw me-2 text-info"></i>
                    Aide
                </a>
                <div class="dropdown-divider" style="margin: 4px 8px;"></div>
                <a class="dropdown-item text-danger" href="#" 
                    data-toggle="modal" data-target="#logoutModal"
                    style="border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 0.85rem;">
                    <i class="fas fa-sign-out-alt fa-sm fa-fw me-2"></i>
                    Déconnexion
                </a>
            </div>
        </li>

    </ul>

</nav>
<style>
   .notification-badge {
    position: absolute;
    top: 12px;
    right: 0px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;

    background-color: #e74a3b;
    color: white;

    border-radius: 10px;

    font-size: 10px;
    font-weight: 700;

    display: flex;
    align-items: center;
    justify-content: center;

    line-height: 1;
    border: 2px solid white;
}
</style>
